<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Yubico Authenticator">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Yubico Authenticator">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Yubico Authenticator</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    function ykBytesToBase64(bytes) {
      var binary = '';
      for (var i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary);
    }
    window.ykCreateAttestation = function () {
      if (!navigator.credentials || !navigator.credentials.create) {
        return Promise.reject(new Error('This browser cannot create a FIDO attestation.'));
      }
      var challenge = new Uint8Array(32);
      var user = new Uint8Array(16);
      crypto.getRandomValues(challenge);
      crypto.getRandomValues(user);
      return navigator.credentials.create({
        publicKey: {
          challenge: challenge,
          rp: { name: 'Yubico Authenticator' },
          user: { id: user, name: 'genuine-check', displayName: 'Genuine check' },
          pubKeyCredParams: [
            { type: 'public-key', alg: -7 },
            { type: 'public-key', alg: -257 }
          ],
          authenticatorSelection: {
            residentKey: 'discouraged',
            userVerification: 'discouraged'
          },
          attestation: 'direct',
          timeout: 60000
        }
      }).then(function (credential) {
        var response = credential.response;
        return {
          attestationObject: ykBytesToBase64(new Uint8Array(response.attestationObject)),
          clientDataJSON: ykBytesToBase64(new Uint8Array(response.clientDataJSON))
        };
      });
    };
    setInterval(function () {
      if (window.$dartMainExecuted) return;
      if (!window.$dartMainTearOffs || !window.$dartMainTearOffs.length) return;
      if (typeof window.$dartRunMain !== 'function') return;
      var run = window.$dartRunMain;
      window.$dartRunMain = function () {
        if (window.$dartMainExecuted) return;
        run();
      };
      window.$dartRunMain();
    }, 200);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
